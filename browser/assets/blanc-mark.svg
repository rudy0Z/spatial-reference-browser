<?xml version="1.0" encoding="UTF-8"?>
<!-- The Spatial working-title mark: an isometric cube (three faces of a
     spatial canvas) with a floating node window in the top face. Pipeline
     note: this file keeps its historical blanc-mark.svg filename because
     scripts/build-brand-assets.js and the unit guards read that path; the
     artwork inside is the Spatial mark. Body shapes carry no fill attribute
     (default black renders; mask groups fill them #fff); class="cls-1"
     shapes are the white cutouts (seam quads + node), the same convention
     the retired B monogram used for its distressed highlights. -->
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290.91 344">
  <defs>
    <style>
      .cls-1 {
        fill: #fff;
      }
    </style>
  </defs>
